<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | SAINT SINNER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="encabezado">
    <a href="index.html" class="marca" aria-label="Saint Sinner, ir al inicio">
      <svg viewBox="0 0 120 120" width="46" height="46" role="img" aria-label="Logo Saint Sinner">
        <circle cx="60" cy="60" r="56" fill="#0A0A0A" stroke="#C9A227" stroke-width="3"/>
        <ellipse cx="60" cy="26" rx="20" ry="5" fill="none" stroke="#C9A227" stroke-width="2"/>
        <text x="60" y="72" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" fill="#C9A227">SS</text>
        <path d="M30 92 Q60 108 90 92" fill="none" stroke="#7A1230" stroke-width="4"/>
      </svg>
      <span>Saint Sinner</span>
    </a>
    <nav class="menu" aria-label="Navegación principal">
      <button id="btn-menu" class="btn-menu" aria-label="Abrir menú">Menú</button>
      <ul id="lista-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="colecciones.html">Colecciones</a></li>
        <li><a href="carrito.html">Carrito (<span id="contador">0</span>)</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="seccion">
      <h1>Contacto</h1>
      <article class="tarjeta-form">
        <h2>Escríbenos</h2>
        <form id="form-contacto" novalidate>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre">

          <label for="correo">Correo</label>
          <input type="email" id="correo" placeholder="tu@correo.com">

          <label for="interes">Me interesa</label>
          <select id="interes">
            <option value="">Selecciona una colección</option>
            <option value="cielo">Cielo (elegante)</option>
            <option value="infierno">Infierno (streetwear)</option>
            <option value="medianoche">Medianoche (mezcla)</option>
          </select>

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" rows="4" placeholder="Cuéntanos qué buscas"></textarea>

          <button type="submit" class="boton">Enviar</button>
          <p id="msg-form" class="mensaje"></p>
        </form>
      </article>
    </section>
  </main>

  <footer class="pie">
    <p class="pie-marca">Saint Sinner</p>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="colecciones.html">Colecciones</a></li>
      <li><a href="carrito.html">Carrito</a></li>
      <li><a href="contacto.html">Contacto</a></li>
      <li><a href="https://www.instagram.com" target="_blank" rel="noopener">Instagram</a></li>
    </ul>
    <p class="pie-copy">© <span id="anio">2026</span> Saint Sinner. Proyecto académico.</p>
  </footer>

  <script src="datos.js"></script>
  <script src="contacto.js"></script>
</body>
</html>
